name: Build and publish

on:
  schedule:
    - cron: "40 3 * * *" # after mkuran's ~00:15 UTC feed rebuild
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build table
        run: python3 build.py
      - name: Assemble site
        run: |
          mkdir -p public
          cp przydzial.html public/index.html
          cp brygady.json public/brygady.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
